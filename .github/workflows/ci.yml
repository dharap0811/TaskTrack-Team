name: TaskTrack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes files
        run: |
          test -f k8s/app-deployment.yaml
          test -f k8s/app-service.yaml

      - name: Validate Kubernetes manifests
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path

          for path in Path("k8s").glob("*.yaml"):
              with path.open(encoding="utf-8") as file:
                  manifests = list(yaml.safe_load_all(file))
              for manifest in manifests:
                  assert isinstance(manifest, dict), f"Invalid document in {path}"
                  assert "apiVersion" in manifest, f"Missing apiVersion in {path}"
                  assert "kind" in manifest, f"Missing kind in {path}"
                  assert "metadata" in manifest, f"Missing metadata in {path}"
              print(f"Validated {path}")
          PY

  test:
    name: Run FastAPI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest -v
  build:
    name: Build and publish Docker image
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile not available yet; skipping build."
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/dharap0811/tasktrack-team:sha-${{ github.sha }}


